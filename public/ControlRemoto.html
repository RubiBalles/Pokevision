<!DOCTYPE html>
<html lang="es">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Control Remoto</title>
      <link rel="stylesheet" href="CSS/mobile.css">
  </head>
  <body class="botonera-active">
    <main>
      <h1>Controlador</h1>
      <div id="botonera">
        <div id="insertCode">
          <label for="pin">Screen PIN:</label>
          <input id="pin" name="pin" maxlength="6" />

          <button onclick="connect()">Conectar</button>
        </div>
          <p id="status"></p>

        <div id="options" style="display: none;">
          
        </div>
        <div id="controls" style="display:none;">
          <button onclick="socket.emit('play')">▶️ Reproducir</button>
          <button onclick="socket.emit('pause')">⏸️ Pausar</button>


        <button onclick="socket.emit('fullscreen')">Pantalla Completa</button>
        
        <div>
          <label for="route">Elige tu ruta:</label>
          <select id="route">
            <option value="tokio">Tokio</option>
            <option value="suiza">Suiza</option>
          </select>
        </div>

        <div>
          <label for="playerSelector">Elige un reproductor:</label>
          <select id="playerSelector">
            <option value="dash">DASH</option>
            <option value="hls">HLS</option>
            <option value="ipfs">IPFS</option>
          </select>
        </div>
        
        <div>
          <label for="volumebar">Volumen:</label>
          <input type="range" id="volumebar" class="volumebar" value="1" min="0" max="1" step=".01">
        </div>
        
        <div>
          <label for="qualitySelector">Calidad: </label>
          <select id="qualitySelector" class="qualitySelector">
            <option value="0">SD (480p)</option>
            <option value="1">HD (720p)</option>
            <option value="2">Full HD (1080p)</option>
            <option value="3">2K</option>
            <option value="4">4K</option>
          </select>
        </div>

        <div>
          <label for="musicSelector">Musica de Fondo:</label>
          <select id="musicSelector">
            <option value="0" default>Gen 1</option>
            <option value="1">Gen 2</option>
          </select>
        </div>

        
        <div>
          <label for="subtitleSelector">Subtitulos:</label>
          <select id="subtitleSelector">
            <option value="-1">Sin subtítulos</option>
            <option value="1">Inglés</option>
            <option value="0">Español</option>
            <option value="2">Catalán</option>
          </select>
        </div>

        <div id="chatButtons">
          <input id="username" type="text" placeholder="Tu nombre" />
          <input id="chatInput" type="text" placeholder="Escribe un mensaje..." />
          <button id="sendBtn">Enviar</button>
        </div>
      </div>
    </div>   
    </main>
    
    <img src="src/img/PokeBall.png" alt="Pokéball" class="pokeball">

    <!-- Scripts -->

    <!---nuevos-->
    <!--<script src="JS/controlremoto.js"></script>-->
    <script src="JS/SpinPokeball.js"></script>
    <script src="JS/DragPokeball.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="JS/SOCKET/controller.js"></script>
    <script src="JS/CONTROL/selectSocketMsg.js"></script>
    <script src="JS/CHAT/chat.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded",spinPokeBall())
    </script>
</body>
</html>
